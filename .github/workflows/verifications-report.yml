name: Verifications Weekly Productivity Report

on:
  schedule:
    # Two Monday runs. Tina isn't in over the weekend, so:
    #   1. Preliminary (09:00 UTC / 10:00 BST) — goes to Tina only and writes
    #      nothing. It shows her the week's short days (including Saturday) so
    #      she can log any approved exceptions via the form.
    #   2. Final (14:15 UTC / 15:15 BST) — re-assesses with those exceptions
    #      applied, commits, and sends to the whole team. Stages only ever
    #      advance on this run, so a review-then-excuse never needs undoing.
    # The odd minute on the final run avoids the contended top-of-hour.
    - cron: '0 9 * * 1'
    - cron: '15 14 * * 1'
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date (YYYY-MM-DD), Monday'
        required: false
      end:
        description: 'End date (YYYY-MM-DD), Saturday'
        required: false
      mode:
        description: 'final = team; preliminary = Tina-only review; preview = Ryan-only test (no writes)'
        required: false
        default: final
        type: choice
        options:
          - final
          - preliminary
          - preview

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Run verifications report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          MC_BASE_URL: ${{ secrets.MC_BASE_URL }}
          MC_USERNAME: ${{ secrets.MC_USERNAME }}
          MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
          MC_CAMPAIGN_ID: ${{ secrets.MC_CAMPAIGN_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "0 9 * * 1" ] || [ "$MODE" = "preliminary" ]; then
            php verifications-report.php --preliminary
          elif [ "$MODE" = "preview" ]; then
            php verifications-report.php --preview
          else
            ARGS=""
            if [ -n "${{ github.event.inputs.start }}" ] && [ -n "${{ github.event.inputs.end }}" ]; then
              ARGS="${{ github.event.inputs.start }} ${{ github.event.inputs.end }}"
            fi
            php verifications-report.php $ARGS
          fi
