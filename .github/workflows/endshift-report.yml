name: End-of-Shift Break Report

on:
  schedule:
    # 21:10 UTC Mon–Sat, after shifts end (~20:47 local). This is 21:10 GMT in
    # winter, 22:10 BST in summer. The odd minute avoids the heavily-contended
    # top-of-hour, which reduces GitHub's scheduling delay.
    #
    # GitHub Actions runs scheduled jobs on a best-effort basis and can delay
    # them by hours — a 21:00 run once slipped to 00:59 the next day. The report
    # script guards against this: a run landing in the small hours (before noon
    # UTC) is treated as a delayed evening run and reports the previous day, so
    # the day that just ended is always the one reported.
    - cron: '10 21 * * 1-6'
  workflow_dispatch:
    inputs:
      day:
        description: 'Day to report on (YYYY-MM-DD), leave blank for today'
        required: false

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, dom

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Run end-of-shift break report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          MC_BASE_URL: ${{ secrets.MC_BASE_URL }}
          MC_USERNAME: ${{ secrets.MC_USERNAME }}
          MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
          MC_CAMPAIGN_ID: ${{ secrets.MC_CAMPAIGN_ID }}
        run: php endshift-report.php ${{ github.event.inputs.day }}
